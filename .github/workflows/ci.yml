name: CI - AgriGest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Verificar e testar o backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      # O backend usa o modulo nativo node:sqlite, que exige Node 22.5+
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Verificar sintaxe do codigo (build/lint)
        run: npm run check

      - name: Rodar os testes automatizados
        run: npm test
